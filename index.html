<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works of Pallavi Monica Ekka</title>
<meta name="description" content="Works of Pallavi Monica Ekka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1d2bd8;
    --blue-deep: #1420a8;
    --ink: #f4f6ff;
    --glow: 0 0 2px rgba(255,255,255,.9), 0 0 8px rgba(170,190,255,.55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--blue);
    color: var(--ink);
    font-family: "VT323", "Courier New", monospace;
    font-size: clamp(22px, 4.2vw, 34px);
    line-height: 1.15;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-shadow: var(--glow);
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  /* CRT: scanlines + vignette + faint flicker */
  body::before, body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
  }
  body::before {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,40,.22) 0 2px, transparent 2px 4px);
    animation: flicker 6s infinite steps(1);
  }
  body::after {
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,30,.55) 100%);
  }
  @keyframes flicker { 0%,100% {opacity:1} 47% {opacity:.85} 48% {opacity:1} 83% {opacity:.92} }

  .screen {
    width: 100%;
    max-width: 760px;
    animation: jitter 9s infinite;
  }
  @keyframes jitter { 0%,96%,100% {transform:none} 97% {transform:translateX(2px)} 98% {transform:translateX(-1px)} }

  .rule {
    display: flex; align-items: center; gap: .5em; white-space: nowrap;
  }
  .rule::before, .rule::after {
    content: ""; flex: 1; border-top: .14em dashed var(--ink);
    box-shadow: var(--glow);
  }
  .rule.plain::before { display: none; }
  .rule.plain::after { margin-left: 0; }

  h1 {
    font: inherit; font-size: 1.15em; margin: 1.1em 0 .7em;
  }
  ul { list-style: none; margin: 0 0 1.4em; padding: 0; }
  li a {
    display: inline-flex; gap: .5em; align-items: baseline;
    color: inherit; text-decoration: none;
    padding: 0 .25em; margin-left: -.25em;
  }
  li a .arrow { display: inline-block; width: .9em; }
  li a[aria-selected="true"] {
    background: var(--ink); color: var(--blue);
    text-shadow: none; box-shadow: 0 0 8px rgba(170,190,255,.6);
  }
  li a[aria-selected="true"] .arrow { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  li a:focus-visible { outline: .1em solid var(--ink); outline-offset: .15em; }
  .desc {
    font-size: .72em; opacity: .85; margin: .25em 0 0 1.55em;
  }

  footer {
    display: grid; grid-template-columns: 1fr auto; gap: 0 1em;
    font-size: .78em; margin-top: .7em;
  }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 0 .6em; }
  .status { text-align: right; }
  .status .mode { display: flex; gap: 1.4em; justify-content: flex-end; }
  .rec { animation: blink 1.4s steps(1) infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  @media (max-width: 480px) {
    footer { grid-template-columns: 1fr; }
    .status { text-align: left; margin-top: .6em; }
    .status .mode { justify-content: flex-start; }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="rule">MENU</div>

    <h1>Works of Pallavi Monica Ekka</h1>

    <ul role="listbox" aria-label="Works">
      <li>
        <a href="https://github.com/pallavimonicaekka/sift" role="option" aria-selected="true">
          <span class="arrow">&#x27A4;</span><span>Sift</span>
        </a>
        <p class="desc">A calm number-sorting game beside Claude Code</p>
      </li>
    </ul>

    <div class="rule plain"></div>

    <footer>
      <div class="keys">
        <span>Select</span><span>:&#x25B2;&#x25BC; Key</span>
        <span>Set</span><span>:&#x27A4; Key</span>
        <span>End</span><span>:Action Key</span>
      </div>
      <div class="status">
        <div class="mode"><span class="rec">&#x25B6; Play</span><span>SP</span></div>
        <div id="counter">0:00:00</div>
      </div>
    </footer>
  </main>

<script>
  // Tape counter
  const counter = document.getElementById('counter');
  const start = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    counter.textContent = `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }, 250);

  // Menu navigation: up/down to select, right/enter to open
  const items = [...document.querySelectorAll('[role="option"]')];
  let idx = 0;
  const select = i => {
    idx = (i + items.length) % items.length;
    items.forEach((a, j) => a.setAttribute('aria-selected', j === idx));
  };
  items.forEach((a, j) => a.addEventListener('mouseenter', () => select(j)));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { select(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { select(idx - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' ||
             (e.key === 'Enter' && document.activeElement !== items[idx])) {
      items[idx].click(); e.preventDefault();
    }
  });
</script>
</body>
</html>
